# Use zsh as default
set -g default-shell /bin/zsh

set-environment -g PATH "/usr/local/bin:/bin:/usr/bin:/usr/local/sbin:/usr/sbin:/sbin"

# Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "tmux-256color" # Set terminal type for 256-color support
set -as terminal-overrides ",*:Tc"

# General
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g mouse on                 # Enable mouse support
set -g status-interval 3        # Update the status bar every 3 seconds (default: 15 seconds)
set -g allow-passthrough on     # Allow programs in the pane to bypass tmux (e.g. for image preview)
set -g visual-activity off
set -g extended-keys on
set -g extended-keys-format csi-u
set-hook -g client-session-changed 'run-shell "tmux set-option -g @last-session \"#{session_name}\""'

set -g @plugin_dir "~/.config/tmux/plugins"

# Set prefix key
unbind C-b              # Unbind the default prefix key
set -g prefix C-Space   # Set new prefix key to Ctrl+Space
# set -g prefix M-w   # Set new prefix key to Alt+W

# Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind-key t popup -d "#{pane_current_path}" \
  -xC -yC \
  -w70% -h75%

bind-key g popup -d "#{pane_current_path}" -w95% -h95% -E lazygit

# Split horizontally in CWD with \\
bind \\ split-window -h -c "#{pane_current_path}"

# Split vertically in CWD with -
bind - split-window -v -c "#{pane_current_path}"

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Use vim arrow keys to resize
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r l resize-pane -R 2
bind -r h resize-pane -L 2

# Use m key to maximize pane
bind -r m resize-pane -Z

# Remove kill window confirmation
bind-key & kill-window   

# Remove kill pane confirmation
bind-key x kill-pane   

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection

# Prefix + v enters copy mode with selection already active
bind v copy-mode \; send -X begin-selection 

# Extras
bind f popup -w 80% -h 25% -x C -y C -E "$HOME/.config/tmux/scripts/tmux-sessionizer.sh"
bind @ popup -w 100% -h 40% -x C -y 9999 -E "$HOME/.config/tmux/scripts/tmux-file-picker.sh"

# Workmux
bind b run-shell "$HOME/.local/bin/workmux sidebar"
bind-key B popup -d "#{pane_current_path}" -w95% -h95% -E "$HOME/.local/bin/workmux dashboard"

# Clear
bind -n M-l send-keys C-l

# Copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "wl-copy"

# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer

# Copy on select
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# tpm plugin manager
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator' # Enable navigating between nvim and tmux
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # CPU and memory info
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-command 'echo -n {} | wl-copy'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum'    # Automatically saves sessions every 15 minutes
# set -g @continuum-restore 'on'

TMUX_FZF_ORDER="copy-mode|session|window|pane|command|keybinding|process"
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2500'

# Style — Catppuccin Mocha
rosewater="#f5e0dc"
red="#f38ba8"
peach="#fab387"
yellow="#f9e2af"
green="#a6e3a1"
teal="#94e2d5"
sky="#89dceb"
blue="#89b4fa"
lavender="#b4befe"
mauve="#cba6f7"
text="#cdd6f4"
subtext0="#a6adc8"
overlay0="#6c7086"
surface0="#313244"
surface1="#45475a"
base="#1e1e2e"
mantle="#181825"
crust="#11111b"

set -g @cpu_percentage true
set -g @mem_percentage true

set -g status-left-length 60
set -g status-right-length 150
set -g status-justify absolute-centre
set -g status-style "fg=${text},bg=${mantle}"
set -g status-left "#[fg=${mauve},bold]󰆍 #S#[fg=${overlay0},nobold]  ·  #[fg=${blue}]󰉋 #{b:pane_current_path} "
set -g status-right "#[fg=${yellow}]#($HOME/.config/tmux/scripts/tmux-git-status.sh \"#{q:pane_current_path}\")#[fg=${overlay0}]  #[fg=${teal}]󰒋 #H#[fg=${overlay0}]  #[fg=${sky}]󰍛 #{cpu}#[fg=${overlay0}]  #[fg=${peach}]󰘚 #{mem} "
set -g window-status-current-format "#[fg=${lavender},bg=${mantle}]#[fg=${mantle},bg=${lavender},bold] #I:#W #[fg=${lavender},bg=${mantle},nobold]"
set -g window-status-format "#[fg=${subtext0},bg=${mantle}] #I:#W "
set -g message-style "fg=${text},bg=${surface0}"
set -g mode-style "fg=${crust},bg=${lavender}"
set -g pane-border-style "fg=${surface1}"
set -g pane-active-border-style "fg=${blue}"
set -g status-position top

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# run '~/.tmux/plugins/tpm/tpm'
run '~/.config/tmux/plugins/tpm/tpm'
